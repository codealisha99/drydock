name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm sandbox:build
      - run: pnpm test:integration

  deploy:
    name: deploy live demo and landing page
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy live demo (repo root) to Vercel production
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_DEMO_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Deploy site/ to Vercel production
        if: env.VERCEL_TOKEN != ''
        working-directory: site
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Skipped (no VERCEL_TOKEN secret)
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN secret is not set, deploys skipped"
